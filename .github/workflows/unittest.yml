name: Offline unittest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install .
      - name: Run offline tests with mocked hardware boundaries
        run: env -u PYTHONPATH PYTHONNOUSERSITE=1 python -B -m unittest discover -s tests -v
