[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marvin-operator"
version = "0.1.0"
description = "Bounded operator controls for the original Microsoft Marvin robot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial==3.5"]

[project.scripts]
marvin = "marvin:main"

[tool.setuptools]
py-modules = ["marvin", "marvin_camera", "marvin_leds", "marvin_sensors"]

[tool.setuptools.packages.find]
include = ["tools*"]
namespaces = true
